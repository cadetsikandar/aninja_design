.frame{display:flex;min-height:100vh;container-type:inline-size;container-name:frame;background:var(--bg-default)}
.navwrap{position:sticky;top:0;height:100vh;flex:0 0 280px;width:280px;align-self:flex-start;z-index:7}
.nav{height:100%;overflow-y:auto;overflow-x:hidden;border-right:1px dashed var(--divider);display:flex;flex-direction:column;scrollbar-width:thin}
.nav-logo{padding:24px 20px 16px;flex-shrink:0}
.nav-logo img{width:122px;height:32px;display:block;cursor:pointer}
.ng{list-style:none;margin:0;padding:0 16px}
.nsub{font-size:11px;font-weight:700;line-height:1.5;text-transform:uppercase;padding:24px 16px 8px;color:var(--text-secondary)}
.nitem{display:flex;align-items:center;height:48px;padding:0 12px 0 16px;margin-bottom:4px;border-radius:8px;color:var(--text-secondary);text-decoration:none;font-size:14px;line-height:22px;cursor:pointer}
.nitem:hover{background:var(--hover)}
.nitem.active{color:var(--nav-active-fg);background:var(--nav-active-bg);font-weight:600}
.nitem.sub{height:36px}
.nitem>.ni{margin-right:16px}
.nitem .nt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .arr{width:16px;height:16px;margin-left:8px}
.nchildren{list-style:none;margin:0;padding:0}
.ni{width:24px;height:24px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.ni>.m{width:100%;height:100%;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.ni>svg{width:100%;height:100%;fill:currentColor}
.lbl-soft{height:24px;min-width:24px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.lbl-error{background:rgba(255,0,0,.16);color:var(--label-error)}
.lbl-warning{background:rgba(255,171,0,.16);color:var(--label-warning)}
.nav-grow{flex:1}
.nav-acc-wrap{padding:24px 20px 16px;flex-shrink:0}
.nav-acc{display:flex;align-items:center;padding:16px 20px;border-radius:12px;background:rgba(145,158,171,.12);box-shadow:var(--shadow-2);color:inherit;text-decoration:none}
.acc-txt{margin-left:16px;min-width:0;flex:1;display:flex;flex-direction:column}
.acc-name{font-size:14px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-role{font-size:14px;line-height:22px;color:var(--text-secondary)}
.nav-acc svg{width:24px;height:24px;margin-left:16px;fill:var(--text-secondary);flex-shrink:0}
.nav-toggle{position:absolute;top:32px;left:268px;z-index:8;width:26px;height:26px;padding:4px;border-radius:50%;border:1px dashed var(--divider);background:color-mix(in srgb,var(--bg-default) 48%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--action-active);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.nav-toggle:hover{background:var(--bg-default)}
.nav-toggle svg{width:16px;height:16px;fill:currentColor}
/* collapsed (mini) nav: 88px, icon over a 10px title */
.navwrap.mini{flex-basis:88px;width:88px}
.navwrap.mini .nav-toggle{top:22px;left:76px}
.mini-logo{display:block;width:32px;height:32px;margin:16px auto;cursor:pointer}
.mg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 6px 16px}
.mitem{position:relative;width:76px;display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;border-radius:8px;color:var(--text-secondary);text-decoration:none;cursor:pointer}
.mitem:hover{color:var(--text-primary);background:var(--hover)}
.mitem.active{color:var(--nav-active-fg);background:var(--nav-active-bg)}
.mitem>.ni{width:22px;height:22px;margin-bottom:4px}
.mitem .mt{width:72px;font-size:10px;line-height:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem.active .mt{font-weight:500}
.mitem .marr{position:absolute;top:11px;right:6px;width:16px;height:16px}
.mdiv{width:24px;height:1px;background:var(--divider);margin:8px 0}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
/* the app's AppBar is fixed: it floats over the page, so shrinking it never moves the content */
.hdr-slot{position:sticky;top:0;height:0;z-index:6}
.hdr{position:absolute;top:0;left:0;right:0;height:92px;transition:height .2s;background:color-mix(in srgb,var(--bg-default) 80%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hdr.offset{height:60px}
.tb{height:100%;display:flex;align-items:center;padding:0 40px}
.icon-btn.burger{display:none;margin-right:8px;color:var(--text-primary)}
.hdr-right{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:12px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--action-active);cursor:pointer;flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.phone-btn{background:var(--custom);color:var(--primary-main)}
.phone-btn:hover{background:var(--primary-lighter)}
.btn-white{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px 0 12px;margin-right:8px;border-radius:8px;border:1px solid var(--divider);background:#FFFFFF;color:var(--pinned-primary);font-size:14px;font-weight:400;cursor:pointer;white-space:nowrap}
.btn-white:hover{background:rgba(255,255,255,.84)}
.av-btn{border:0;background:none;padding:0;border-radius:50%;cursor:pointer;display:inline-flex}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.content{padding:100px 16px 100px}
.container{max-width:1200px;width:100%;margin:0 auto;padding:0 24px}
.grid{display:flex;gap:24px;align-items:flex-start}
.col-left{flex:0 0 calc((100% + 24px) / 3 - 24px);min-width:0;margin-top:24px;padding-top:5px;border-top:2px dotted var(--grey-300)}
.col-right{flex:1;min-width:0}
@container frame (max-width:1199px){
  .navwrap{display:none}
  .icon-btn.burger{display:inline-flex}
  .hdr,.hdr.offset{height:64px}
  .tb{padding:0 24px}
  .content{padding:72px 0 100px}
}
@container frame (max-width:899px){
  .col-left{display:none}
}
@container frame (max-width:599px){
  .tb{padding:0 16px}
  .hdr-right{gap:4px}
  .container{padding:0 16px}
}

/* lead column: EditLeadInfo + accordions + Delete/Merge, as in the app */
.lead-head{position:relative}
.lead-title{display:flex;align-items:center;gap:8px;padding:8px 0 0}
.lead-title svg{width:24px;height:24px;fill:currentColor;flex-shrink:0}
.lead-name{font-size:17.6px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-right:32px}
.lead-paper{margin-top:8px;padding:16px;border-radius:8px;background:var(--grey-200);border:1px solid rgba(145,158,171,.06);display:flex;flex-direction:column;gap:14px}
.lp-row{display:flex;gap:6px;align-items:flex-start}
.lp-row svg{width:20px;height:20px;flex-shrink:0;margin-top:2px;fill:currentColor}
.lp-row .pri{fill:var(--primary-main)}
.lp-row a{text-decoration:none;overflow-wrap:anywhere}
.lead-edit{position:absolute;top:0;right:0}
.accs{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.acc-row{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 8px 0 16px;border:0;border-radius:8px;background:var(--grey-200);color:var(--text-primary);font-size:16px;line-height:24px;font-weight:600;cursor:pointer;text-align:left;width:100%}
.acc-row svg{width:20px;height:20px;fill:currentColor;margin-right:4px}
.lead-actions{display:flex;gap:44px;padding-top:8px}
.btn-grey{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:30px;padding:4px 10px;border:0;border-radius:8px;background:var(--grey-200);color:var(--text-primary);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-grey:hover{background:var(--grey-300)}
.btn-grey svg{width:18px;height:18px;fill:currentColor}

/* lead navigation slider (shown when the lead was opened from the list) */
.slider{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:16px;background:var(--bg-paper);padding:12px 24px;border-radius:50px;box-shadow:var(--shadow-20);border:1px solid var(--divider)}
.fab{width:40px;height:40px;border-radius:50%;border:0;background:var(--primary-main);color:var(--primary-contrast);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.fab svg{width:20px;height:20px;fill:currentColor}
.slider .pos{min-width:80px;text-align:center;font-weight:500;color:var(--text-secondary)}

/* phone-width drawer */
.drawer-back{position:fixed;inset:0;z-index:40;background:rgba(22,28,36,.48)}
.drawer{position:fixed;top:0;bottom:0;width:280px;background:var(--bg-default);box-shadow:var(--shadow-pop)}
.drawer .nav{border-right:0}

/* interactions toolbar (copied from the app, including its fixed white buttons) */
.interactions{border-left:2px dotted var(--grey-300)}
.toolbar{margin-top:24px;background:var(--bg-neutral);padding:8px;display:flex;gap:8px;align-items:center;overflow-x:auto;white-space:nowrap}
.toolbar>*{flex-shrink:0}
.tb-text{height:38px;padding:4px 12px;border:0;border-radius:8px;background:var(--white);color:var(--primary-main);font-size:15px;cursor:pointer}
.split{display:inline-flex;align-items:center;border:1px solid var(--grey-200);border-radius:8px;background:var(--white);overflow:hidden;height:34px}
.split button{border:0;background:none;color:var(--primary-main);height:34px;display:inline-flex;align-items:center;padding:0 8px;cursor:pointer}
.split button:hover{background:rgba(32,22,96,.06)}
.split .sep{width:1px;align-self:stretch;background:var(--grey-200)}
.split svg{width:18px;height:18px}
.split .chev svg{width:13px;height:13px}
.sq{width:34px;height:34px;border:1px solid var(--grey-200);border-radius:8px;background:var(--white);color:var(--primary-main);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.sq svg{width:18px;height:18px}
.filter-btn{height:34px;padding:4px 12px;border:1px solid var(--grey-200);border-radius:8px;background:var(--white);color:var(--primary-main);font-size:15px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.filter-btn.on{border-color:var(--primary-main);background:rgba(32,22,96,.06)}
.filter-badge{width:16px;height:16px;border-radius:50%;background:var(--primary-main);color:var(--primary-contrast);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.wf-placeholder{margin-top:16px;padding:16px;border:1px dashed var(--divider);border-radius:8px;color:var(--text-secondary)}

/* ---------- MUI Timeline ---------- */
.timeline{list-style:none;margin:0;padding:6px 16px;display:flex;flex-direction:column}
.tl-item{display:flex;min-height:70px}
.tl-sep{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.tl-dot{display:flex;padding:4px;border:2px solid transparent;border-radius:50%;margin:11.5px 0;color:var(--dot-icon);background:var(--grey-400);position:relative}
.tl-dot.clickable{cursor:pointer}
.tl-conn{width:2px;flex-grow:1;background:var(--divider)}
.tl-content{flex:1;padding:6px 16px;min-width:0;max-width:calc(100% - 32px)}
.tl-date{padding:6px 16px 6px 0;color:var(--text-secondary)}
.card{padding:12px;background:var(--card);border-radius:8px;display:flex;gap:8px}
.card>*{min-width:0}
.grow{flex:1;min-width:0}
.badge{position:absolute;top:-6px;right:-8px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--error-main);color:#FFFFFF;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.tavatar{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;margin-right:8px}
.av-primary{background:var(--primary-main);color:var(--primary-contrast)}
.av-info{background:var(--info-main);color:#FFFFFF}
.av-success{background:var(--success-main);color:#FFFFFF}
.av-warning{background:var(--warning-main);color:#212B36}
.av-error{background:var(--error-main);color:#FFFFFF}
.av-default{background:var(--grey-400);color:var(--bg-paper)}
.link{color:var(--primary-main);text-decoration:underline;cursor:pointer}
.btn-contained{display:inline-flex;align-items:center;gap:6px;height:30px;padding:4px 10px;border-radius:8px;border:0;font-weight:700;font-size:13px;cursor:pointer;background:var(--pinned-primary);color:#FFFFFF}
:root[data-theme="dark"] .btn-contained{background:#FFFFFF;color:var(--pinned-primary)}
.btn-text{display:inline-flex;align-items:center;gap:6px;height:30px;padding:4px 6px;border-radius:8px;border:0;background:none;font-weight:700;font-size:13px;color:var(--text-primary);cursor:pointer}
.btn-text:hover{background:var(--hover)}
.btn-contained svg,.btn-text svg{width:18px;height:18px}

/* call card */
.call-box{position:relative;background:var(--card);border-radius:12px;border:1px solid #E5E7EB;overflow:hidden}
.call-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid rgba(0,0,0,.06)}
.call-side{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.call-side .lbl{color:var(--text-secondary);font-weight:500;flex-shrink:0}
.call-side .val{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text-secondary)}
.rec .bar{flex:1;height:4px;border-radius:2px;background:var(--divider)}

/* text bubble */
.bubble{padding:12px;border-radius:8px;width:100%;display:flex;flex-direction:column;row-gap:8px}
.bubble.out{background:var(--custom)}
.bubble.fail{background:var(--error-lighter)}
.bubble.in{background:var(--card)}
.status-line{display:flex;justify-content:flex-end;align-items:center;gap:2px}

/* email */
.paper-email{background:var(--card);border:1px solid var(--grey-400);border-radius:8px;overflow:hidden}
.subject{padding:4px 8px;background:var(--card);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.email-row{padding:2px 8px}
.email-row+.email-row{border-top:2px solid rgba(22,28,36,.12)}
.email-sum{display:flex;align-items:center;gap:16px;min-height:48px;cursor:pointer}
.email-sum .chev{transition:transform .2s;color:var(--text-primary)}
.email-sum .chev svg{width:12px;height:12px}
.email-sum.open .chev{transform:rotate(90deg)}
.email-from{color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
.email-prev{flex:1;min-width:0;font-size:12px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.email-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.email-meta svg{width:20px;height:20px}
.email-heads{width:70%;display:flex;flex-direction:column;gap:8px}
.email-heads .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.email-body{padding:8px 4px 12px 28px}
.email-actions{display:flex;margin-top:8px}
.email-actions .icon-btn{color:var(--text-secondary)}

/* chatbot */
.chat-box{height:300px;overflow:auto;background:var(--bg-paper);border-radius:8px;padding:16px}
.msg{display:flex;flex-direction:column;margin-bottom:24px;max-width:100%}
.msg.me{align-items:flex-end}
.msg .who{font-size:12px;font-weight:500;color:var(--text-secondary)}
.msg .txt{padding:8px 10px;border-radius:8px;margin:8px 0;background:var(--card)}
.msg.contact .txt{background:#FFFFFF;color:#100C3A}

/* ---------- v1 chip (kept for the "Current" comparison only through the same component) ---------- */
.chip{display:inline-flex;align-items:baseline;gap:4px;height:24px;max-width:min(280px,100%);padding:2px 10px;border-radius:999px;font-size:14px;font-weight:600;line-height:20px;vertical-align:baseline;white-space:nowrap;background:var(--chip-bg);color:var(--chip-fg);text-decoration:none;border:0;font-family:inherit;min-width:0;flex-shrink:1}
.chip>svg,.chip>.chip-av{align-self:center}
.chip.has-av{padding-left:3px}
.chip-label{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip-sub{font-weight:400}
.chip-ic{width:14px;height:14px;flex:0 0 auto;fill:currentColor}
.chip-av{width:18px;height:18px;border-radius:50%;background:var(--primary-main);color:var(--primary-contrast);font-size:9px;font-weight:700;letter-spacing:.2px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.chip-go{width:12px;height:12px;flex:0 0 auto;fill:currentColor;opacity:.72;margin-left:-1px}
/* small chip: sits in 12px caption text (the text footer, the email row, the bubble status) */
.chip.sm{height:20px;padding:1px 8px;font-size:12px;line-height:18px}
.chip.sm.has-av{padding-left:2px}
.chip.sm .chip-ic{width:12px;height:12px}
.chip.sm .chip-av{width:16px;height:16px;font-size:8px}
/* only link chips react to the pointer: underline + darker surface + ↗ */
a.chip{cursor:pointer}
a.chip:hover{background:var(--chip-bgh)}
a.chip:hover .chip-label{text-decoration:underline}
a.chip:focus-visible{outline:2px solid var(--chip-fg);outline-offset:2px}
/* a date/time keeps its timezone label: it shortens only when it is wider than the whole card */
.chip.k-time{flex-shrink:0;max-width:100%}
.t-primary{--chip-bg:var(--soft-primary-bg);--chip-bgh:var(--soft-primary-bgh);--chip-fg:var(--soft-primary-fg)}
.t-default{--chip-bg:var(--soft-default-bg);--chip-bgh:var(--soft-default-bgh);--chip-fg:var(--soft-default-fg)}
.t-warning{--chip-bg:var(--soft-warning-bg);--chip-bgh:var(--soft-warning-bgh);--chip-fg:var(--soft-warning-fg)}
.t-success{--chip-bg:var(--soft-success-bg);--chip-bgh:var(--soft-success-bgh);--chip-fg:var(--soft-success-fg)}
.t-error{--chip-bg:var(--soft-error-bg);--chip-bgh:var(--soft-error-bgh);--chip-fg:var(--soft-error-fg)}

/* ---------- v2 placement ---------- */
/* 24px chips on 28px lines: wrapped lines keep an even 4px gap and never touch */
.say{margin:0;font-size:14px;line-height:28px}
.say-sm{font-size:12px;line-height:24px}
/* the word before a chip, the chip and the punctuation after it never split across lines */
.grp{display:inline-flex;align-items:baseline;max-width:100%;white-space:nowrap;vertical-align:baseline}
.grp>.kt{white-space:pre}
.grp-time{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:4px;min-width:0}
/* one label column: labels line up, values line up */
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:16px;row-gap:4px;align-items:start;margin:0;min-width:0}
.dl dt{color:var(--text-secondary);line-height:28px;white-space:nowrap}
.dl dd{margin:0;min-width:0;min-height:28px;display:flex;align-items:center;flex-wrap:wrap;column-gap:8px}
.dl dd.txt{display:block;padding-top:3px;overflow-wrap:anywhere}
.dl .aside{color:var(--text-secondary);overflow-wrap:anywhere}
.call-dl{flex:1;min-width:0}
/* label + chip pairs that wrap as a unit (text footer) */
.pairs{display:flex;flex-wrap:wrap;align-items:center;column-gap:16px;row-gap:4px;min-width:0}
.pair{display:inline-flex;align-items:baseline;gap:6px;min-width:0;max-width:100%}
.pair>.lbl{color:var(--text-secondary);flex-shrink:0}
@container frame (max-width:599px){
  /* phone: labels sit above their values, so values get the full card width */
  .dl{grid-template-columns:minmax(0,1fr);row-gap:0}
  .dl dt{font-size:12px;line-height:18px;margin-top:6px}
  .dl dt:first-child{margin-top:0}
  .dl dd.txt{padding-top:0}
  .pair>.lbl{min-width:30px}
}
body.view-changes .bubble.out{background:var(--primary-lighter)}
body.view-changes .bubble.fail{background:var(--error-tint)}

/* ---------- overlays ---------- */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--tooltip);color:#FFFFFF;font-size:12px;line-height:18px;padding:4px 8px;border-radius:6px;max-width:320px;opacity:0;transition:opacity .12s;white-space:normal;overflow-wrap:anywhere}
#tip.show{opacity:1}
.pop{position:fixed;z-index:45;background:var(--bg-paper);border-radius:10px;box-shadow:var(--shadow-pop);padding:6px;min-width:140px}
.pop .mi{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:6px;border:0;background:none;color:var(--text-primary);font-size:14px;cursor:pointer}
.pop .mi:hover,.pop .mi.sel{background:var(--custom);color:#212B36}
.acc-pop{width:200px;padding:0}
.acc-pop .who{padding:12px 20px}
.acc-pop .who b{display:block;font-size:14px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-pop .who span{display:block;font-size:14px;line-height:22px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-pop hr{border:0;border-top:1px dashed var(--divider);margin:0}
.acc-pop .grp-m{padding:8px}
.acc-pop .mi:hover{background:var(--hover);color:var(--text-primary)}
.acc-pop .danger{color:var(--error-main)}
.fpop{padding:12px;width:220px}
.fpop .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--divider)}
.fpop .ttl{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.6px}
.fpop .ttl span.ic{width:24px;height:24px;border-radius:8px;background:rgba(32,22,96,.1);display:inline-flex;align-items:center;justify-content:center;color:var(--primary-main)}
.fpop .ttl svg{width:14px;height:14px}
.fpop .x{width:24px;height:24px;border-radius:12px;border:0;background:var(--grey-100);color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.fpop .x svg{width:14px;height:14px}
.fpop .sub{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.2px;margin-bottom:8px}
.fopt{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;font-size:12px;font-weight:600}
.fopt input{width:18px;height:18px;accent-color:var(--primary-main);margin:9px}
.fopt .chipico{width:18px;height:18px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:rgba(223,227,232,.8);color:var(--grey-600)}
.fopt.on .chipico{background:var(--primary-main);color:#FFFFFF}
.fopt.on .lab{color:var(--primary-main)}
.fopt .chipico svg{width:10px;height:10px}
.clear-f{margin-top:12px;width:100%;border:0;background:none;color:var(--text-secondary);font-size:12px;font-weight:700;padding:6px;border-radius:8px;cursor:pointer}
.clear-f:hover{background:var(--grey-200)}
.details{padding:16px;max-width:500px}
.details .r{display:flex;justify-content:space-between;align-items:center}
.details .r span{font-size:12px;color:gray}
.details .r span+span{padding:0 24px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--tooltip);color:#FFFFFF;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spinner{width:40px;height:40px;border-radius:50%;border:3.6px solid var(--primary-main);border-right-color:transparent;animation:spin 1s linear infinite;margin:8px}
.spinner.sm{width:22px;height:22px;border-width:2.5px}
@keyframes spin{to{transform:rotate(360deg)}}
.sentinel{display:flex;justify-content:center;align-items:center;min-height:40px;padding:8px 0}
.empty{padding:8px 16px}

/* ---------- demo panel (prototype only) ---------- */
.demo{position:fixed;right:16px;bottom:16px;z-index:30;width:300px;max-height:calc(100vh - 32px);overflow:auto;background:var(--bg-paper);color:var(--text-primary);border:1px solid var(--divider);border-radius:12px;box-shadow:var(--shadow-pop);font-size:13px;line-height:18px}
.demo.min .demo-body{display:none}
.demo-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--divider);gap:8px}
.demo-head b{font-size:13px}
.demo-head .ver{font-size:11px;color:var(--text-secondary)}
.demo-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.demo label.t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--text-secondary);display:block;margin-bottom:4px}
.seg{display:flex;border:1px solid var(--divider);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--text-primary);padding:6px 4px;font-size:12px;font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--divider)}
.seg button.on{background:var(--soft-primary-bg);color:var(--soft-primary-fg)}
.demo select{width:100%;padding:6px;border-radius:8px;border:1px solid var(--divider);background:var(--bg-paper);color:var(--text-primary);font-family:inherit;font-size:12px}
.demo .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.demo .acts button,.demo .reset{border:1px solid var(--divider);background:none;color:var(--text-primary);border-radius:8px;padding:6px;font-size:12px;cursor:pointer;font-family:inherit}
.demo .acts button:hover,.demo .reset:hover{background:var(--hover)}
.demo .reset{width:100%;font-weight:700}
.demo .note{font-size:11px;color:var(--text-secondary);line-height:16px}
.demo details{border:1px solid var(--divider);border-radius:8px;padding:6px 8px}
.demo summary{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--text-secondary);cursor:pointer}
.demo ol{margin:6px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:16px}
.demo .min-btn{border:0;background:none;color:var(--text-secondary);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:6px}
.demo .min-btn:hover{background:var(--hover)}
body.narrow .frame{width:390px;margin:0 auto;border-left:1px solid var(--divider);border-right:1px solid var(--divider)}
body.narrow{background:var(--grey-200)}
@media (max-width:600px){.demo{width:calc(100vw - 32px)}}

<div id="app"></div>
<div id="tip" role="tooltip" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   Lead timeline chips · prototype v2 · 17 Nov 2026

/* ---------- the chip component ---------- */
// What each kind of value is, for the colour variations.
const GROUP = { seq:"name", workflow:"name", trigger:"name", task:"name", value:"name", user:"person", contact:"person", step:"pos", status:"pos", time:"time" };
function tone(kind) {
  if (kind === "error") return "error";
  const g = GROUP[kind] || "name";
  if (state.variant === "single") return "primary";
  if (state.variant === "accent") return g === "time" ? "success" : "primary";
  return { name:"primary", person:"default", pos:"warning", time:"success" }[g];
}
// o: icon | avatar (team member) | href (opens something: ↗ + hover) | sub (lighter second part) | sm (12px, in caption text) | tip
function chip(kind, text, o = {}) {
  const t = tone(o.tone || kind);
  const lead = o.avatar ? `<span class="chip-av" aria-hidden="true">${esc(initials(o.avatar))}</span>` : o.icon ? ic(o.icon, "chip-ic") : "";
  const cls = `chip t-${t} k-${kind}${o.avatar ? " has-av" : ""}${o.sm ? " sm" : ""}`;
  const label = `<span class="chip-label">${esc(text)}${o.sub ? ` <span class="chip-sub">${esc(o.sub)}</span>` : ""}</span>`;
  const inner = `${lead}${label}${o.href ? ic("upRight", "chip-go") : ""}`;
  return o.href ? `<a class="${cls}" href="#" data-np="${esc(o.href)}">${inner}</a>` : `<span class="${cls}"${o.tip ? ` data-tip="${esc(o.tip)}"` : ""}>${inner}</span>`;
}
// A sentence: plain strings and chip objects { k, v, ...chip options }.
// The short phrase (or last word) right before each chip and any punctuation right after it are pulled into one unbreakable group,
// so a line never ends on "by" / "at" / "sending" with the value on the next line, and never starts with "," or ".".
function segs(list) {
  // neighbouring plain strings become one, so punctuation can never be split from the word before it
  const src = list.reduce((a, x) => (typeof x === "string" && typeof a[a.length - 1] === "string" ? (a[a.length - 1] += x, a) : (a.push(x), a)), []), out = [];
  for (let i = 0; i < src.length; i++) {
    const s = src[i];
    if (typeof s === "string") { out.push(esc(s)); continue; }
    let pre = "", post = "";
    if (typeof src[i - 1] === "string") {
      // a short connecting phrase ("resumed by", "status changed from") travels whole with its value; a longer one gives its last word
      const lead = src[i - 1].match(/^(\s*)([\s\S]*)$/);
      const words = lead[2].trim().split(/\s+/).filter(Boolean).length;
      const m = words && words <= 3 ? lead : src[i - 1].match(/^([\s\S]*?)(\S+\s*)$/);
      if (m) { pre = m[2]; out[out.length - 1] = esc(m[1]); }
    }
    if (typeof src[i + 1] === "string") {
      const m = src[i + 1].match(/^([,.:;)!?]+)/);
      if (m) { post = m[1]; src[i + 1] = src[i + 1].slice(post.length); }
    }
    const c = chip(s.k, s.v, s);
    out.push(pre || post ? `<span class="grp${s.k === "time" ? " grp-time" : ""}">${pre ? `<span class="kt">${esc(pre)}</span>` : ""}${c}${post ? `<span class="kt">${esc(post)}</span>` : ""}</span>` : c);
  }
  return out.join("");
}
const seqIcon = (channel) => (/^e/i.test(channel) ? "mailOut" : "msgOut");
const dl = (rows) => `<dl class="dl">${rows.filter(Boolean).map(([l, v, txt]) => `<dt>${esc(l)}</dt><dd${txt ? ' class="txt"' : ""}>${v}</dd>`).join("")}</dl>`;
// The app's own trigger event labels (Automation › trigger editor).
const EVENT_LABEL = { "Customfield.created":"Lead Custom field created", "Customfield.value.changed":"Lead Custom field value changed", "Incoming.call":"Incoming call", "Voicemail.received":"Incoming voicemail", "Incoming.sms":"Incoming SMS", "Incoming.any":"Incoming Any ( email, text )", "Incoming.email":"Incoming email", "Lead.created":"Lead created", "Lead.created.chatbot":"Lead created via Chatbot", "Lead.created.api":"Lead created via API", "Lead.created.facebook":"Lead created via Facebook", "Lead.created.calendly":"Lead created via Calendly", "calendar.lead.created":"Lead Created via Calendar", "calendar.meeting.booked":"Meeting Booked via Calendar", "Outgoing.sms.error":"Outgoing SMS with error code", "Outgoing.email.opened":"Outgoing email opened", "Workflow.Step.Status.changed":"Workflow Step Status changed" };

/* ---------- parsing the saved sentences (what lets old notes get chips with no data migration) ----------
   Every note is read back as: what it is about, its name, what happened, then the details. */
function parseNote(it) {
  const c = it.content || "";
  const seq = (ch, v) => ({ k:"seq", v, icon:seqIcon(ch) });
  const step = (a, b) => ({ k:"step", v: b ? `Step ${a} of ${b}` : `Step ${a}` });
  let m;
  if ((m = c.match(/^(Text|Email) sequence "(.+)" resumed by (.+) at step (\d+) of (\d+), sending (.+)\.$/)))
    return [`${m[1]} sequence `, seq(m[1], m[2]), " resumed by ", { k:"user", v:m[3], avatar:m[3] }, " at ", step(m[4], m[5]), ", sending ", { k:"time", v:m[6], icon:"schedule" }, "."];
  if ((m = c.match(/^(Text|Email) sequence "(.+)" paused at step (\d+) of (\d+): (.+)\.$/)))
    return [`${m[1]} sequence `, seq(m[1], m[2]), " paused at ", step(m[3], m[4]), `: ${m[5]}.`];
  if ((m = c.match(/^Daily (text|email) limit reached, retrying (.+) \((\d+) of (\d+)\)\.$/)))
    return [`Daily ${m[1]} limit reached, retrying `, { k:"time", v:m[2], icon:"schedule" }, ", ", { k:"step", v:`Attempt ${m[3]} of ${m[4]}` }, "."];
  if ((m = c.match(/^Skipped (text|email) step (\d+) of sequence "(.+)": (.+)$/)))
    return [`${cap1(m[1])} sequence `, seq(m[1], m[3]), " skipped ", step(m[2]), `: ${m[4]}`];
  if ((m = c.match(/^Failed to (process|deliver) (email|sms) step (\d+) of sequence "(.+)" because: "?(.*?)"?$/))) {
    const ch = m[2] === "sms" ? "Text" : "Email";
    return [`${ch} sequence `, seq(ch, m[4]), ` failed to ${m[1]} `, step(m[3]), `: ${m[5]}`];
  }
  if ((m = c.match(/^Trigger "(.+)" stopped: (.+)$/))) {
    const list = m[2].split(", ");
    const out = ["Trigger ", { k:"trigger", v:m[1] }, ` stopped ${list.length} sequence${list.length > 1 ? "s" : ""}: `];
    list.forEach((nm, i) => { if (i) out.push(", "); out.push({ k:"seq", v:nm }); });
    return out;
  }
  if ((m = c.match(/^Workflow "(.+)" step "(.+)" status changed from "(.+)" to "(.+)"$/)))
    return ["Workflow ", { k:"workflow", v:m[1] }, " step ", { k:"value", v:m[2] }, " status changed from ", { k:"status", v:m[3] }, " to ", { k:"status", v:m[4] }];
  if ((m = c.match(/^Workflow "(.+)" step "(.+)" status (set|changed) to "(.+)"$/)))
    return ["Workflow ", { k:"workflow", v:m[1] }, " step ", { k:"value", v:m[2] }, ` status ${m[3]} to `, { k:"status", v:m[4] }];
  if ((m = c.match(/^Workflow "(.+)" (added to|removed from) the lead$/)))
    return ["Workflow ", { k:"workflow", v:m[1] }, ` ${m[2]} the lead`];
  if ((m = c.match(/^(Created|Completed) "(.+)" task$/))) {
    const out = ["Task ", { k:"task", v:m[2] }, ` ${m[1].toLowerCase()}`];
    if (it.assignedTo) out.push(", assigned to ", { k:"user", v:names().mate, avatar:names().mate });
    return out;
  }
  if ((m = c.match(/^Lead created via (.+)$/))) return ["Lead created via ", { k:"value", v: m[1] === "api" ? "API" : cap1(m[1]) }];
  if ((m = c.match(/^(Text|Email) sequence "(.+)" was not resumed: (.+)$/)))
    return [`${m[1]} sequence `, seq(m[1], m[2]), ` was not resumed: ${m[3]}`];
  return null; // anything else stays a plain sentence
}

  return item(dot("", "phone"), `${dateLine(it.createdAt)}<div class="card" style="flex-direction:column;gap:8px">
    <div style="display:flex;gap:8px;align-items:center"><span style="color:var(--success-main)">${ic("phone")}</span><span class="b2${changes() ? " say" : ""}" style="font-weight:500">${changes() ? segs([{ k:"contact", v:it.forwardedTo }, " (from Private number)"]) : `${esc(it.forwardedTo)} (from Private number)`}</span></div>
    <p class="b2" style="color:gray">Call forwarding from a private number activated for ${esc(dur)}</p></div>`);
}

function emailBlock(em, showSubject, avatarName) {
  const open = state.expandedEmails.has(em.id);
  const from = em.from[0] || {};
  const fromName = from.name || from.email || "";
  const trunc = fromName.length > 15 ? `${fromName.slice(0, 12)}...` : fromName;
  const incoming = em.emailType === "Incoming";
  const stamp = em.status === "scheduled"
    ? (changes() ? segs(["Scheduled for ", { k:"time", v:fTimeline(em.schedule), icon:"schedule", sm:true }]) : `Scheduled for ${esc(fTimeline(em.schedule))}`)
    : esc(`${fTimeline(em.createdAt)} · ${timeAgo(em.createdAt)}`);
  const heads = () => {
    if (!changes()) {
      const line = (label, list, withName) => !list.length ? "" : `<div class="row"><span class="b2 muted" style="margin-right:8px">${label}</span>${list.map((p) => `${withName && p.name ? `<span class="b2 muted">${esc(p.name)}</span> ` : ""}<span class="b2">&lt;${esc(p.email)}&gt;</span>`).join(" ")}</div>`;
      return `<div class="email-heads">${line("From:", em.from, true)}${line("To:", em.to, false)}${line("Cc:", em.cc, false)}</div>`;
    }
    // a named person is a chip (team members with their initials) and the address follows as plain text
    const who = (p) => (p.name ? `${chip(p.user ? "user" : "contact", p.name, p.user ? { avatar:p.name } : {})}<span class="aside">${esc(p.email)}</span>` : chip("contact", p.email));
    return `<div class="email-heads">${dl([["From", em.from.map(who).join("")], ["To", em.to.map(who).join("")], em.cc.length ? ["Cc", em.cc.map(who).join("")] : null])}</div>`;
  };
  return `<div>${showSubject ? `<div class="subject"><span class="b2" style="font-weight:600">${esc(em.subject)}</span>${avatarName ? tAvatar(avatarName) : ""}</div>` : ""}
    <div class="email-row"${showSubject ? ' style="border-top:0"' : ""}>
      <div class="email-sum${open ? " open" : ""}" data-email="${esc(em.id)}" role="button" tabindex="0" aria-expanded="${open}">
        <span class="chev">${ic("chevRight")}</span>
        ${open ? heads() : `<span class="b2 email-from">${esc(trunc)}</span><span class="email-prev">${esc(em.message)}</span>`}
        <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;margin-left:auto"><div class="email-meta"><span style="color:${incoming ? "var(--error-main)" : "var(--secondary-main)"}">${ic(incoming ? "downLeft" : "upRight")}</span><span class="cap muted${changes() && em.status === "scheduled" ? " say-sm" : ""}">${stamp}</span></div>
        ${open ? `<div class="email-actions"><button class="icon-btn" aria-label="Reply" ${np("Opens a reply")}>${ic("reply")}</button><button class="icon-btn" aria-label="Reply all" ${np("Opens a reply to all")}>${ic("replyAll")}</button><button class="icon-btn" aria-label="Forward" ${np("Opens a forward")}>${ic("forward")}</button></div>` : ""}</div>
      </div>
      ${open ? `<div class="email-body b2">${esc(em.message)}</div>` : ""}
    </div></div>`;
}

function renderEmail(it) {
  const bg = it.emailType === "Outgoing" ? "var(--primary-dark)" : "var(--secondary-main)";
  return item(dot(bg, "mail"), `<div class="tl-date"></div><div class="paper-email">${emailBlock(it, true, it.user && it.user.displayName)}</div>`);
}
function renderThread(it) {
  const unread = it.emails.filter((e) => e.emailType === "Incoming" && !e.isDone && !state.readIds.has(e.id));
  const d = `<span class="tl-dot${unread.length ? " clickable" : ""}" style="background:var(--primary-dark)"${unread.length ? ` data-markread="${esc(it.id)}" data-tip="Mark as read all" role="button" tabindex="0"` : ""}>${ic("mails").replace('class="i"', 'class="i" style="transform:scaleX(-1)"')}${unread.length ? `<span class="badge">${unread.length}</span>` : ""}</span>`;
  return item(d, `<div class="tl-date"></div><div class="paper-email">${it.emails.map((e, i) => emailBlock(e, i === 0, i === 0 ? it.user.displayName : null)).join("")}</div>`);
}

function renderNote(it) {
  const open = state.expandedNotes.has(it.id);
  return item(dot("var(--warning-dark)", "note"), `${dateLine(it.createdAt)}<div class="card"><div class="grow">
    <p class="b2" style="${open ? "" : "overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical"}">${esc(it.note)}</p>
    <span class="cap" style="color:var(--primary-main);cursor:pointer;margin-top:4px;display:block" data-note="${esc(it.id)}" role="button" tabindex="0">${open ? "Show less" : "Show more"}</span></div>${tAvatar(it.createdBy.displayName)}</div>`);
}

function renderChatbot(it) {
  const contact = names().contact;
  const msgs = it.messages.map((m) => {
    const me = m.role === "assistant";
    return `<div class="msg ${me ? "me" : "contact"}"><span class="who">${esc(me ? "bot" : contact)}</span><div class="txt b2">${esc(m.content)}</div><span class="who" style="font-size:9px">${esc(fTimeline(m.createdAt))}</span></div>`;
  }).join("");
  return item(dot("var(--primary-main)", "bot"), `${dateLine(it.createdAt)}<div class="card"><div class="grow">
    ${!it.isDone ? `<div style="display:flex;justify-content:flex-end"><button class="btn-contained" style="background:var(--secondary-main);color:#FFFFFF" data-done="${esc(it.id)}">✓ Done</button></div>` : ""}
    <div style="display:flex;gap:8px;margin:16px 0 16px 16px"><div class="chat-box grow">${msgs}</div>${tAvatar("AI Assistant")}</div></div></div>`);
}

function renderItem(it) {
  switch (it.type) {
    case "info_note": return renderInfo(it);
    case "text": return renderText(it);
    case "call": return renderCall(it);
    case "callForwarding": return renderForwarding(it);
    case "email": return renderEmail(it);
    case "email-thread": return renderThread(it);
    case "note": return renderNote(it);
    case "chatbot": return renderChatbot(it);
    default: return "";
  }
}

function renderToolbar(c) {

function counts(items) {
  const flat = items.flatMap((i) => (i.type === "email-thread" ? i.emails.map(() => ({ type:"email" })) : [i]));
  const c = { all:flat.length };
  ["call","email","note","text"].forEach((t) => { c[t] = flat.filter((i) => i.type === t).length; });
  return c;
}

function renderTimeline() {
  const items = allItems();
  renderToolbar(counts(items));
  const tl = document.getElementById("timeline");
  const below = document.getElementById("below");
  if (state.loading) { tl.innerHTML = `<li><span class="spinner" aria-label="Loading"></span></li>`; below.innerHTML = ""; return; }
  if (state.error) { tl.innerHTML = ""; below.innerHTML = `<p class="b2 muted empty">The timeline could not be loaded.</p>`; return; }
  // The app loads 25 timeline records per page, then groups emails into threads and filters.
  const loaded = items.slice(0, state.page * PAGE);
  let rows = loaded;
  if (state.filters.length) rows = rows.filter((i) => (state.filters.includes("email") && (i.type === "email" || i.type === "email-thread")) || state.filters.includes(i.type));
  tl.innerHTML = rows.map(renderItem).join("");
  tl.querySelectorAll(".chat-box").forEach((b) => { b.scrollTop = b.scrollHeight; }); // the app opens a chat at its last message
  const hasMore = loaded.length < items.length;
  below.innerHTML = !rows.length && !hasMore
    ? `<p class="b2 muted empty">${state.filters.length ? "No activity matches the selected filters." : "No activity on this lead yet."}</p>`
    : `<div class="sentinel" id="sentinel">${state.loadingMore ? '<span class="spinner sm" aria-label="Loading more"></span>' : ""}</div>`;
  observeSentinel(hasMore);
}

let io;
function observeSentinel(hasMore) {
  if (io) io.disconnect();
  const s = document.getElementById("sentinel");
  if (!s || !hasMore) return;
  io = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && !state.loadingMore) {
      state.loadingMore = true; renderTimeline();
      setTimeout(() => { state.loadingMore = false; state.page += 1; renderTimeline(); }, 700);
    }
  }, { rootMargin:"200px" });
  io.observe(s);
}

/* ---------- overlays ---------- */
const tipEl = document.getElementById("tip");
function showTip(target, text) {
  tipEl.textContent = text; tipEl.classList.add("show");
  const r = target.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  let left = r.left + r.width / 2 - t.width / 2; left = Math.max(8, Math.min(left, window.innerWidth - t.width - 8));
  let top = r.top - t.height - 8; if (top < 8) top = r.bottom + 8;
  tipEl.style.left = `${left}px`; tipEl.style.top = `${top}px`;
}
const hideTip = () => tipEl.classList.remove("show");
function tipFor(el) {
  const c = el.closest(".chip");
  if (c) {
    if (c.dataset.tip) return { el:c, text:c.dataset.tip };
    const l = c.querySelector(".chip-label");
    if (l && l.scrollWidth > l.clientWidth + 1) return { el:c, text:l.textContent }; // full value only when it is cut off
    return null;
  }
  const d = el.closest("[data-tip]");
  return d ? { el:d, text:d.dataset.tip } : null;
}
document.addEventListener("mouseover", (e) => { const t = tipFor(e.target); if (t) showTip(t.el, t.text); else hideTip(); });
document.addEventListener("focusin", (e) => { const t = tipFor(e.target); if (t) showTip(t.el, t.text); });
document.addEventListener("focusout", hideTip);
window.addEventListener("scroll", hideTip, true);

let pop = null;
function closePop() { if (pop) { pop.remove(); pop = null; } }
function openPop(anchor, html, align = "left", cls = "") {
  closePop();
  pop = document.createElement("div"); pop.className = `pop ${cls}`; pop.innerHTML = html; document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect(), p = pop.getBoundingClientRect();
  let left = align === "right" ? r.right - p.width : align === "center" ? r.left + r.width / 2 - p.width / 2 : r.left;
  left = Math.max(8, Math.min(left, window.innerWidth - p.width - 8));
  let top = r.bottom + 4; if (top + p.height > window.innerHeight - 8) top = Math.max(8, r.top - p.height - 4);
  pop.style.left = `${left}px`; pop.style.top = `${top}px`;
  return pop;
}
let toastTimer;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }

function openFilter(anchor) {
  const html = () => `<div class="head"><span class="ttl"><span class="ic">${ic("filter")}</span>Filters</span><button class="x" aria-label="Close" data-fclose>${ic("close")}</button></div>
    <div class="sub">Message Types</div>
    ${FILTERS.map(([t, l, i]) => `<label class="fopt${state.filters.includes(t) ? " on" : ""}"><input type="checkbox" data-f="${t}"${state.filters.includes(t) ? " checked" : ""}><span class="chipico">${ic(i)}</span><span class="lab">${l}</span></label>`).join("")}
    ${state.filters.length ? `<button class="clear-f" data-fclear>Clear filters</button>` : ""}`;
  const p = openPop(anchor, html(), "right", "fpop");
  p.addEventListener("click", (e) => {
    e.stopPropagation();
    if (e.target.closest("[data-fclose]")) return closePop();
    if (e.target.closest("[data-fclear]")) { state.filters = []; }
    const box = e.target.closest("input[data-f]");
    if (box) { const t = box.dataset.f; state.filters = state.filters.includes(t) ? state.filters.filter((x) => x !== t) : [...state.filters, t]; }
    if (box || e.target.closest("[data-fclear]")) { savePrefs(); renderTimeline(); p.innerHTML = html(); }
  });
}
function openAccount(anchor) {
  const n = names();
  openPop(anchor, `<div class="who"><b>${esc(n.me)}</b><span>${esc(n.meEmail)}</span></div><hr>
    <div class="grp-m"><button class="mi" ${np("Opens Home")}>Home</button><button class="mi" ${np("Opens Profile settings")}>Profile settings</button></div><hr>
    <div class="grp-m"><button class="mi danger" ${np("Asks to log every team member out of every device")}>Logout from All Devices</button></div><hr>

function openDrawer() {

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target;
  if (pop && !pop.contains(t) && !t.closest("#filterBtn,[data-menu],[data-details],#accBtn")) closePop();
  if (t.id === "drawerBack") { closeDrawer(); return; }
  const kids = t.closest("[data-navkids]");
  if (kids) { e.preventDefault(); const k = kids.dataset.navkids; state.navOpen.has(k) ? state.navOpen.delete(k) : state.navOpen.add(k); if (t.closest("#drawerBack")) openDrawer(); else renderNav(); return; }
  const npEl = t.closest("[data-np]");
  if (npEl) { e.preventDefault(); toast(`${npEl.dataset.np}. Not part of this prototype.`); return; }
  if (t.closest("a[aria-current]")) { e.preventDefault(); closeDrawer(); return; }
  if (t.closest("#navToggle")) { state.navMini = !state.navMini; savePrefs(); renderNav(); return; }
  if (t.closest("#burger")) { openDrawer(); return; }
  if (t.closest("#accBtn")) { pop && pop.classList.contains("acc-pop") ? closePop() : openAccount(t.closest("#accBtn")); return; }
  if (t.closest("#wfBtn")) { state.showWorkflows = !state.showWorkflows; renderToolbar(counts(allItems())); return; }
  if (t.closest("#filterBtn")) { pop && pop.classList.contains("fpop") ? closePop() : openFilter(t.closest("#filterBtn")); return; }
  const menu = t.closest("[data-menu]");
  if (menu) {
    const opts = menu.dataset.menu.split("|");
    const p = openPop(menu, opts.map((o, i) => `<button class="mi${i === 0 ? " sel" : ""}" data-np="Opens the ${esc(o.toLowerCase())} composer">${esc(o)}</button>`).join(""), "center");
    p.addEventListener("click", closePop); return;
  }
  const det = t.closest("[data-details]");
  if (det) {
    const d = JSON.parse(det.dataset.details);
    openPop(det, `<div class="details">${Object.entries(d).map(([k, v]) => `<div class="r"><span>${esc(k)}:</span><span>${esc(v)}</span></div>`).join("")}</div>`, "left"); return;
  }
  const em = t.closest("[data-email]");
  if (em) { const id = em.dataset.email; state.expandedEmails.has(id) ? state.expandedEmails.delete(id) : state.expandedEmails.add(id); renderTimeline(); return; }
  const nt = t.closest("[data-note]");
  if (nt) { const id = nt.dataset.note; state.expandedNotes.has(id) ? state.expandedNotes.delete(id) : state.expandedNotes.add(id); renderTimeline(); return; }
  const mr = t.closest("[data-markread]");
  if (mr) { const th = allItems().find((i) => i.id === mr.dataset.markread); th.emails.forEach((x) => state.readIds.add(x.id)); hideTip(); renderTimeline(); return; }
  const rs = t.closest("[data-resume]");
  if (rs) { toast("Opens the Resume sequence dialog. Use “Sequence resumed” in the demo panel to add the note it writes."); return; }
  if (t.closest("[data-done]")) { toast("Marks the chatbot conversation as done. Not part of this prototype."); return; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closePop(); hideTip(); closeDrawer(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button][tabindex]")) { e.preventDefault(); e.target.click(); }
});
window.addEventListener("resize", () => { closePop(); closeDrawer(); });
// The header shrinks from 92px to 60px once the page scrolls past it (useOffSetTop in Header.tsx).
function onScroll() { const h = document.getElementById("hdr"); if (h) h.classList.toggle("offset", window.scrollY > 92); }
window.addEventListener("scroll", onScroll, { passive:true });

function setTheme(mode) {
  state.theme = mode; document.documentElement.dataset.theme = mode; savePrefs();
  renderNav(); syncDemo();
}

/* ---------- demo panel ---------- */
const RULES = [
  "A chip never leaves the short phrase before it (“resumed by”, “at”, “sending”) or the punctuation after it, so a line never ends on a dangling word.",
  "Every note reads the same way: what it is about, its name, then what happened (“Task [name] created”).",
  "Only key values become chips: names, people, steps, statuses, dates. Reasons, notes and the lead's own email or phone stay text.",
  "Labels sit in one column and values line up next to them (From / To, When / Meeting type). On a phone the labels move above their values.",
  "A chip matches the text around it: 14px in sentences, 12px in the small caption lines.",
  "Only chips that open something react to the pointer, and they carry ↗.",
  "24px chips on 28px lines: wrapped lines keep the same spacing.",
  "Names shorten with “…” and show the full value on hover. Dates and steps are never cut."
];
function demoPanel() {
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-set="${key}" data-val="${v}" class="${String(state[key]) === v ? "on" : ""}">${l}</button>`).join("")}</div>`;
  const d = document.createElement("div"); d.className = "demo"; d.id = "demo";
  d.innerHTML = `<div class="demo-head"><div><b>Lead timeline chips</b><div class="ver">Prototype v2 · 17 Nov 2026 · demo data</div></div><button class="min-btn" id="minBtn" aria-label="Hide demo panel">Hide</button></div>
  <div class="demo-body" id="demoBody"></div>`;
  document.body.appendChild(d);
  const body = () => `
    <div><label class="t">Show</label>${seg("view", [["current","Current"],["changes","With changes"]])}</div>
    <details><summary>How chips are placed</summary><ol>${RULES.map((r) => `<li>${esc(r)}</li>`).join("")}</ol></details>
    <div><label class="t">Chip colours</label>${seg("variant", [["single","Single colour"],["multi","Multi colour"],["accent","Time only"]])}
      <div class="note" style="margin-top:4px">${state.variant === "single" ? "One colour for every chip (the default)." : state.variant === "multi" ? "Sequence purple, people grey, step and status amber, date and time green." : "One colour, with date and time chips in green."}</div></div>
    <div><label class="t">Theme</label>${seg("theme", [["light","Light"],["dark","Dark"]])}</div>
    <div><label class="t">Width</label>${seg("narrow", [["false","Desktop"],["true","Phone (390px)"]])}</div>
    <div><label class="t">Names</label>${seg("longNames", [["false","Typical"],["true","Very long"]])}</div>
    <div><label class="t">Viewer's timezone</label><select id="tzSel" aria-label="Viewer's timezone">
      ${[["","This browser"],["America/New_York","New York"],["America/Los_Angeles","Los Angeles"],["Asia/Karachi","Karachi"]].map(([v, l]) => `<option value="${v}"${state.tz === v ? " selected" : ""}>${l}</option>`).join("")}</select>
      <div class="note" style="margin-top:4px">Card timestamps follow the viewer. A sequence's send time keeps the sequence's own timezone and names it (EST in winter, EDT in summer).</div></div>
    <div><label class="t">Simulate</label><div class="acts">
      <button data-sim="resume">Sequence resumed</button><button data-sim="sms">Incoming text</button>
      <button data-sim="loading">Slow loading</button><button data-sim="error">Load error</button>
      <button data-sim="empty">${state.empty ? "Restore items" : "Empty timeline"}</button><button data-sim="top">Back to top</button></div></div>
    <button class="reset" id="resetBtn">Reset demo</button>`;
  window.syncDemo = () => { const open = d.querySelector("details") && d.querySelector("details").open; document.getElementById("demoBody").innerHTML = body(); if (open) d.querySelector("details").open = true; };
  syncDemo();
  d.addEventListener("click", (e) => {
    const s = e.target.closest("[data-set]");
    if (s) {
      const key = s.dataset.set; let v = s.dataset.val; if (v === "true" || v === "false") v = v === "true";
      if (key === "theme") return setTheme(v);
      state[key] = v; savePrefs(); applyLayout(); closeDrawer();
      if (key === "longNames") renderShell();
      renderTimeline(); syncDemo(); return;
    }
    const sim = e.target.closest("[data-sim]");
    if (sim) simulate(sim.dataset.sim);
    if (e.target.closest("#resetBtn")) reset();
    if (e.target.closest("#minBtn")) { d.classList.toggle("min"); e.target.textContent = d.classList.contains("min") ? "Show" : "Hide"; }
  });
  d.addEventListener("change", (e) => { if (e.target.id === "tzSel") { state.tz = e.target.value; savePrefs(); renderTimeline(); } });
}

function simulate(kind) {
  const n = names();
  if (kind === "resume") {
    state.seq += 1; state.resumed.add("s2");
    const when = new Date(NOW.getTime() + state.seq * 60000);
    state.extra.unshift({ id:`sim-r${state.seq}`, type:"info_note", eventType:"sequenceResumed", color:"blue", icon:"info", createdAt:when,
      content:`Email sequence "${n.emailSeq}" resumed by ${n.me} at step 3 of 4, sending 18 Nov, 9:00 AM EST.`, sequence:{ id:"s2", type:"email", stepOrder:3 } });
    toast("Added the note the backend writes when a sequence is resumed.");
  }
  if (kind === "sms") {
    state.seq += 1;
    state.extra.unshift({ id:`sim-t${state.seq}`, type:"text", textType:"Incoming", status:"sent", createdAt:new Date(NOW.getTime() + state.seq * 60000),
      from:{ name:n.contact, phone:n.phone }, to:{ name:n.line, phone:n.linePhone }, user:{ displayName:n.me }, content:"Thursday at 3 works. See you then!" });
  }
  if (kind === "loading") { state.loading = true; renderTimeline(); setTimeout(() => { state.loading = false; renderTimeline(); }, 2000); return; }
  if (kind === "error") { state.error = true; renderTimeline(); setTimeout(() => { state.error = false; renderTimeline(); }, 3000); return; }
  if (kind === "empty") { state.empty = !state.empty; syncDemo(); }
  if (kind === "top") { window.scrollTo({ top:0, behavior:"smooth" }); return; }
  state.page = 1; renderTimeline(); window.scrollTo({ top:0, behavior:"smooth" });
}

function reset() {
  Object.assign(state, { ...DEFAULTS, ...fresh() });
  savePrefs(); closePop(); closeDrawer(); document.documentElement.dataset.theme = state.theme; applyLayout(); renderShell(); renderTimeline(); syncDemo();
  toast("Demo reset.");
}

function applyLayout() { document.body.classList.toggle("narrow", !!state.narrow); document.body.classList.toggle("view-changes", state.view === "changes"); }

/* ---------- boot ---------- */
document.documentElement.dataset.theme = state.theme;
applyLayout(); renderShell(); demoPanel(); renderTimeline();
</script>
</body>
</html>
